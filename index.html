<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIGAP - Pacientes</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5fa;
      color: #333;
    }

    .encabezado {
      background: #075a9c;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 28px;
    }

    .encabezado h2 {
      margin: 5px 0;
      font-size: 20px;
    }

    .contenedor {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      text-align: center;
    }

    .logo {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .sigap {
      font-size: 28px;
      font-weight: bold;
      color: #075a9c;
    }

    .mensaje {
      margin-top: 20px;
      line-height: 1.6;
    }

  </style>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({

      appId: "cba47c3a-17f3-4b19-9fd3-e2d94f4ef9f8",

      serviceWorkerPath: "sigap-pacientes/OneSignalSDKWorker.js",

      serviceWorkerParam: {
        scope: "/sigap-pacientes/"
      },

      notifyButton: {
        enable: true
      }

    });

  });
</script>
  
</head>

<body>

  <div class="encabezado">

    <h1>🛡️ Enfermería Regimentaria</h1>

    <h2>"La Reina"</h2>

    <div>
      Macro Zona de Salud<br>
      Santiago Centro Oriente
    </div>

  </div>

  <div class="contenedor">

    <div class="tarjeta">

      <div class="logo">🩺</div>

      <div class="sigap">
        SIGAP
      </div>

      <div class="mensaje">

        <h2>Página de Pacientes</h2>

        <p>
          Sistema Inteligente de Gestión
          y Atención de Pacientes
        </p>

        <p>
          Esta página será utilizada para
          registrar su llegada y recibir
          notificaciones cuando sea su turno.
        </p>

      </div>

    </div>

  </div>

</body>

</html>
